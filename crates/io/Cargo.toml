[package]
name = "cadcraft-io"
description = "CADCraft file formats: DXF read/write mapping, SVG, PNG and PDF export"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
cadcraft-doc = { workspace = true }
cadcraft-dxf = { workspace = true }
cadcraft-dwg = { workspace = true }
cadcraft-render = { workspace = true }
cadcraft-fonts = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
miniz_oxide = "0.9"
craft-pdf = { workspace = true, features = ["write"] }
quick-xml = { workspace = true }
hayro = { workspace = true }
# Geometry types of the PDF reader's API (the version hayro uses).
kurbo = "0.13"
# PNG files of the pictures PDFIMPORT takes out of a page.
tiny-skia = { workspace = true }
# Which paths stored in a drawing (PDF underlays) may be opened.
craft-docpath = { workspace = true }

[dev-dependencies]
# Reads CADCraft's DWG output as written (tests only; the same version as cadcraft-dwg's).
acadrust = "0.6.5"
# Reads plotted PDFs back.
craft-pdf = { workspace = true, features = ["read"] }
